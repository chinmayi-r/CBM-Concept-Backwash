# CBM baseline within the minimal_cbm framework (model_type: cbm), for an
# apples-to-apples MCBM-vs-CBM comparison under one codebase. The PRIMARY CBM
# numbers come from the official ConceptBottleneck trainer (train/cbm_cub.sh);
# this config exists so the minimal_cbm intervention/test tooling can also be run
# on a CBM. Same data/encoder as cub-mcbm.yaml, no gamma term.
data:
  name: cub
  manifest_dir: ${oc.env:CURATED_DATA}/cub_mcbm
  image_root: ${oc.env:CURATED_DATA}/CUB_200_2011/images
  n_concepts: 112
  n_classes: 200
  image_size: 299
model:
  model_type: cbm
  encoder:
    arch: inception_v3
    pretrained: true
  beta: 1.0
training:
  batch_size: 64
  n_epochs: 300
  optimizer: sgd
  lr: 0.01
  weight_decay: 0.00004
  scheduler: step
  scheduler_step: 1000
