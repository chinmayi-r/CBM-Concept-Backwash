# CBM (standard concept bottleneck) on CUB-200 through minimal_cbm -- the
# same-backbone REFERENCE for the CUB gamma comparison. True CBM (no var_z
# sampling), NOT MCBM at gamma=0. Same encoder/data as cub-vanilla + cub-mcbm.
# A literature-faithful CBM (InceptionV3, 3 regimes) also comes from the official
# ConceptBottleneck trainer via train/cbm_cub.sh -- keep that as a separate,
# labeled cross-check, do not conflate it with this same-backbone comparison.
# Tokens filled by train/_paths.sh: __ARCH__, __IMGS_DIR__, __PKLS_DIR__, __ATTR_DIR__.
data:
    dataset: CUB200
    imgs_dir: __IMGS_DIR__
    pkls_dir: __PKLS_DIR__
    attr_dir: __ATTR_DIR__
    modify_pkls: False
    n_groups_concepts: 28        # verified canonical zero-based indices span 28 groups
model:
    model_type: cbm
    encoder:
        arch: __ARCH__
        hidden_dim: 1024
        pretrained: true
    hidden_dims_y: 256
    hidden_dims_c: [3]
    beta: 1.0
training:
    batch_size: 64
    n_epochs: 250
    save_epochs: 50
    optimizer:
        optimizer: SGD
        base_batch_size: 64
        base_lr: 0.01
        batch_size: 64
        momentum: 0.9
        weight_decay: 0.00004
    scheduler:
        gamma: 0.1
        scheduler: StepLR
        step_size: 100
