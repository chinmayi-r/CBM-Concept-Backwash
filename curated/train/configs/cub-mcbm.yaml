# MCBM on CUB-200 -- real minimal_cbm CUB200 schema (verified against
# configs/cub12/cub12-mcbm-01.yaml + src/datasets/cub200.py). CUB is NATIVE to
# minimal_cbm (no compat shim; run_mcbm.py's FUNNYBIRDS branch is simply not
# taken). CUB is the literature cross-check; FunnyBirds is the headline.
#
# Tokens filled by train/_paths.sh: __ARCH__, __GAMMA__, __IMGS_DIR__,
# __PKLS_DIR__ (CUB_processed/class_attr_data_10), __ATTR_DIR__ (has attributes.txt).
data:
    dataset: CUB200
    imgs_dir: __IMGS_DIR__
    pkls_dir: __PKLS_DIR__       # train.pkl/test.pkl (yewsiang CUB_processed)
    attr_dir: __ATTR_DIR__       # dir containing attributes.txt
    modify_pkls: False           # do NOT rewrite the source pickles
    n_groups_concepts: 28        # TODO verify: full 112-attr CUB = 28 attribute groups;
                                 # must be <= total groups or CUB200 sampling raises.
model:
    model_type: mcbm
    encoder:
        arch: __ARCH__           # default resnet50 (~inception_v3 size). NOTE: inception_v3 wants img 299.
        hidden_dim: 1024
        pretrained: true
    hidden_dims_y: 256
    var_z: 1
    hidden_dims_c: [3]
    hidden_dims_z: null          # z prior = fixed 6c-3 (+-3 fixed points)
    beta: 1.0
    gamma: __GAMMA__             # minimality weight; effective force = gamma * 0.2
training:
    batch_size: 64
    n_epochs: 250
    save_epochs: 50
    optimizer:
        optimizer: SGD
        base_batch_size: 64
        base_lr: 0.01
        batch_size: 64
        momentum: 0.9
        weight_decay: 0.00004
    scheduler:
        gamma: 0.1               # LR decay factor -- NOT the minimality gamma
        scheduler: StepLR
        step_size: 100
