# MCBM on the 70-class CUB70 subset. The manifest dir is selected by the LABELS
# env var (original|relabeled) so prof note #4 can compare grounding before/after
# visibility relabeling without editing this file.
data:
  name: cub
  manifest_dir: ${oc.env:CURATED_DATA}/cub70_mcbm_${oc.env:LABELS,original}
  image_root: ${oc.env:CURATED_DATA}/CUB_200_2011/images
  n_concepts: 112
  n_classes: 70
  image_size: 299
model:
  model_type: mcbm
  encoder:
    arch: inception_v3
    pretrained: true
  hidden_dims_z: 16
  gamma: 1.0
  beta: 1.0
training:
  batch_size: 64
  n_epochs: 300
  optimizer: sgd
  lr: 0.01
  weight_decay: 0.00004
  scheduler: step
  scheduler_step: 1000
