# Vanilla (no concept bottleneck) on CUB-200 -- task-accuracy ceiling / no-concepts
# control. Same encoder/data as cub-cbm + cub-mcbm; only the head differs.
# Tokens filled by train/_paths.sh: __ARCH__, __IMGS_DIR__, __PKLS_DIR__, __ATTR_DIR__.
data:
    dataset: CUB200
    imgs_dir: __IMGS_DIR__
    pkls_dir: __PKLS_DIR__
    attr_dir: __ATTR_DIR__
    modify_pkls: False
    n_groups_concepts: 28        # TODO verify (see cub-mcbm.yaml)
model:
    model_type: vanilla
    encoder:
        arch: __ARCH__
        hidden_dim: 1024
        pretrained: true
    hidden_dims_y: 256
training:
    batch_size: 64
    n_epochs: 250
    save_epochs: 50
    optimizer:
        optimizer: SGD
        base_batch_size: 64
        base_lr: 0.01
        batch_size: 64
        momentum: 0.9
        weight_decay: 0.00004
    scheduler:
        gamma: 0.1
        scheduler: StepLR
        step_size: 100
